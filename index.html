<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aplicación en pantalla completa</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    #recargar {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <button id="recargar" onclick="document.getElementById('miIframe').src += ''">🔄 Recargar</button>
  <iframe id="miIframe" src="https://script.google.com/macros/s/AKfycbwcNUyTk_TZ1xydylcnnP5RLSr2RkClLyaDwdvE1m_pEjzJYgND-BkNy9hpK77glsYJ/exec" allowfullscreen></iframe>
</body>
</html>
